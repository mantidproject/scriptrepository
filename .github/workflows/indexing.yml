name: Index Repository

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - 'repository.json'

jobs:
  indexing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.INDEXING }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          
      - name: Create repository index file
        run: |
          python system/scriptrepositoryparser.py $PWD/ $PWD/
          
      - name: Commit repository index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository.json
          git diff --cached --quiet && exit 0
          git commit -m "Updating repository index JSON file" --no-verify
          git push
